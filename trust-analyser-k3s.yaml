apiVersion: v1
kind: Namespace
metadata:
  name: trust-analyser
---
# Persistent Storage (K3s uses local-path provisioner automatically)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: trust-analyser
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# MongoDB Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-mongo
  namespace: trust-analyser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          env:
            - name: MONGO_INITDB_DATABASE
              value: "telemetry"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: trust-analyser
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongo
---
# Telemetry API Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  namespace: trust-analyser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-api
  template:
    metadata:
      labels:
        app: telemetry-api
    spec:
      containers:
        - name: telemetry-api
          image: kingalawaka/telemetry-api-2:v14
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/"
            - name: DB_NAME
              value: "telemetry"
            - name: SERVICE_IP
              value: "192.168.1.237"
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
  namespace: trust-analyser
spec:
  type: LoadBalancer
  ports:
    - port: 9001
      targetPort: 8001
  selector:
    app: telemetry-api
---
# Webapp Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-webapp
  namespace: trust-analyser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-webapp
  template:
    metadata:
      labels:
        app: telemetry-webapp
    spec:
      containers:
        - name: telemetry-webapp
          image: kingalawaka/telemetry-webapp-2:v14
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-webapp
  namespace: trust-analyser
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 80
  selector:
    app: telemetry-webapp
---
# ADI Connector Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ta-adi-connector
  namespace: trust-analyser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-ta-adi-connector
  template:
    metadata:
      labels:
        app: telemetry-ta-adi-connector
    spec:
      containers:
        - name: telemetry-ta-adi-connector
          image: kingalawaka/telemetry-adi-service:v6
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-ta-adi-connector
  namespace: trust-analyser
spec:
  type: LoadBalancer
  ports:
    - port: 9002
      targetPort: 8000
  selector:
    app: telemetry-ta-adi-connector
---
# ADI WebSocket Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ta-adi-ws
  namespace: trust-analyser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-ta-adi-ws
  template:
    metadata:
      labels:
        app: telemetry-ta-adi-ws
    spec:
      containers:
        - name: telemetry-ta-adi-ws
          image: kingalawaka/telemetry-adi-ws:v3